<script>
/* До первого рендера: применяем сохранённые настройки и запускаем Telegram,
   чтобы не было «мигания» темы и шапки Telegram. */
(function(){
  var d=document.documentElement,S={};
  try{S=JSON.parse(localStorage.getItem('om:settings')||'{}')||{}}catch(e){}
  var W=window.Telegram&&window.Telegram.WebApp,inTG=!!(W&&W.platform&&W.platform!=='unknown');
  var th=S.theme||'system';
  if(th==='system'){if(inTG&&W.colorScheme)d.setAttribute('data-theme',W.colorScheme)}else d.setAttribute('data-theme',th);
  d.setAttribute('data-glass',S.glass||'mid');d.setAttribute('data-fs',S.font||'m');
  if(S.rt)d.setAttribute('data-rt','');if(S.motion)d.setAttribute('data-motion','reduce');
  if(!inTG)return;
  d.classList.add('tg','tg-'+W.platform);
  var v=function(x){return !!(W.isVersionAtLeast&&W.isVersionAtLeast(x))};
  var mob=['ios','android','android_x'].indexOf(W.platform)>-1;
  try{
    W.ready();W.expand();
    if(v('7.7'))W.disableVerticalSwipes();                       // свайп вниз скроллит, а не закрывает
    if(mob&&v('8.0')&&W.requestFullscreen){                       // полный экран, если клиент умеет; иначе остаётся expand()
      if(!W.isFullscreen)W.requestFullscreen();
      try{W.lockOrientation()}catch(e){}
    }
  }catch(e){}
})();
</script>

<style>
/* VOICE: спокойное, премиальное, как нативное приложение iOS.
   IDEA: стопка фотокарточек под жидким стеклом (эталон — Kyant Backdrop / iOS 26).
   PICTURE: полноэкранные фото анкет; стекло — прозрачное, с преломлением по краю и тонкой кромкой.
   COLOUR and TYPE: графит / светлый, один акцент — розово-красный; Manrope.
   LAYOUT: одна колонка телефона, стеклянный бар на всю ширину. */

/* ============ ТОКЕНЫ: светлая тема ============ */
:root{color-scheme:light;
  --bg:#eef0f4;--bg2:#fff;--ink:#0c0d10;--mute:rgba(20,22,28,.64);--line:rgba(0,0,0,.08);--fill:rgba(118,118,128,.12);
  --card-in:rgba(255,255,255,.72);--seg-on:#fff;--dash:rgba(0,0,0,.18);--ind:rgba(0,0,0,.07);--press-c:rgba(0,0,0,.07);
  --blob1:rgba(255,110,140,.30);--blob2:rgba(120,130,255,.26);--blob3:rgba(70,210,190,.22);
  --acc:#ff2d55;--acc-ink:#d70f3d;--ok:#30d158;
  /* стекло */
  --g-rgb:255,255,255;--g-pn-rgb:252,252,254;--g-sheen:rgba(255,255,255,.65);--g-stroke:rgba(255,255,255,.75);
  --g-edge:rgba(0,0,0,.07);--g-hl:rgba(255,255,255,.95);--g-shadow:0 8px 26px rgba(30,34,60,.12);--g-solid:rgba(250,250,252,.97);
  /* интенсивность стекла — «средняя» */
  --g-blur:16px;--g-sat:180%;--g-a:.4;--g-pa:.74;--g-dka:.16;
  /* безопасные зоны: Telegram → env() */
  --top:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
  --bot:calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + var(--tg-content-safe-area-inset-bottom,0px));
  --stop:var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px));--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  /* движение */
  --out:cubic-bezier(.16,1,.3,1);--ease:cubic-bezier(.22,.9,.24,1);--bounce:cubic-bezier(.34,1.4,.5,1);--d:.45s;

/* ============ ТОКЕНЫ: тёмная тема (по системе и вручную) ============ */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#07080b;--bg2:#15161c;--ink:#f5f5f7;--mute:rgba(235,235,245,.62);--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);
  --card-in:rgba(255,255,255,.06);--seg-on:#5b5b62;--dash:rgba(255,255,255,.2);--ind:rgba(255,255,255,.13);--press-c:rgba(0,0,0,.22);
  --blob1:rgba(255,45,85,.20);--blob2:rgba(90,100,255,.20);--blob3:rgba(40,180,170,.14);--acc-ink:#ff6b81;
  --g-rgb:44,46,58;--g-pn-rgb:30,31,40;--g-sheen:rgba(255,255,255,.12);--g-stroke:rgba(255,255,255,.16);
  --g-edge:rgba(0,0,0,.45);--g-hl:rgba(255,255,255,.26);--g-shadow:0 10px 30px rgba(0,0,0,.45);--g-solid:rgba(28,29,36,.97);--press-l:rgba(255,255,255,.12);--bg-rgb:7,8,11}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#07080b;--bg2:#15161c;--ink:#f5f5f7;--mute:rgba(235,235,245,.62);--line:rgba(255,255,255,.1);--fill:rgba(118,118,128,.24);
  --card-in:rgba(255,255,255,.06);--seg-on:#5b5b62;--dash:rgba(255,255,255,.2);--ind:rgba(255,255,255,.13);--press-c:rgba(0,0,0,.22);
  --blob1:rgba(255,45,85,.20);--blob2:rgba(90,100,255,.20);--blob3:rgba(40,180,170,.14);--acc-ink:#ff6b81;
  --g-rgb:44,46,58;--g-pn-rgb:30,31,40;--g-sheen:rgba(255,255,255,.12);--g-stroke:rgba(255,255,255,.16);
  --g-edge:rgba(0,0,0,.45);--g-hl:rgba(255,255,255,.26);--g-shadow:0 10px 30px rgba(0,0,0,.45);--g-solid:rgba(28,29,36,.97);--press-l:rgba(255,255,255,.12);--bg-rgb:7,8,11}

:root[data-glass=low]{--g-blur:8px;--g-sat:140%;--g-a:.62;--g-pa:.88;--g-dka:.3}

/* размер шрифта в чате */
:root[data-fs=s]{--chat-fs:14px}:root[data-fs=l]{--chat-fs:18px}

/* ============ БАЗА ============ */
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
html.tg,html.tg body{position:fixed;inset:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Manrope,-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input,textarea,.m,.bio{-webkit-user-select:text;user-select:text}img{-webkit-user-drag:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}/* 16px — без автозума iOS */
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
mark{background:none;color:inherit}
#app{position:relative;height:var(--tg-viewport-height,100dvh);width:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--bg)}
html.tg #app{border-radius:0;box-shadow:none}
@media(min-width:700px){body{display:grid;place-items:center;background:radial-gradient(1200px 700px at 20% 10%,var(--blob2),transparent),var(--bg)}
  #app{height:min(100dvh - 40px,920px);border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 1px var(--line)}
  html.tg body{display:block}html.tg #app{max-width:480px;height:var(--tg-viewport-height,100dvh);border-radius:0;box-shadow:0 0 0 .5px var(--line)}}
/* плавная смена темы (~200 мс), включается только на момент переключения */
html.theming,html.theming *,html.theming *::before{transition:background-color .2s ease-out,color .2s ease-out,border-color .2s ease-out,box-shadow .2s ease-out,fill .2s,stroke .2s!important}
/* уменьшить анимации: настройка + системная */

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ============ LIQUID GLASS — один набор классов на весь UI ============
   .glass        — прозрачное стекло (бар, кнопки, поля, поиск)
   .glass.pn     — панель с текстом (шторки, карточки настроек, уведомления) — плотнее для контраста ≥ 4.5:1
   .glass.dk     — стекло поверх фотографий (всегда светлый текст)
   Блюр не вкладывается в блюр: внутри .pn используются непрозрачные карточки (.group без .glass). */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(180deg,var(--g-sheen),rgba(255,255,255,0) 52%),rgba(var(--g-rgb),var(--g-a));
  -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
  box-shadow:inset 0 0 0 999px var(--press,transparent),inset 0 1px 0 var(--g-hl),inset 0 0 0 .5px var(--g-stroke),0 0 0 .5px var(--g-edge),var(--g-shadow)}
.glass.pn{background:linear-gradient(180deg,var(--g-sheen),rgba(255,255,255,0) 40%),rgba(var(--g-pn-rgb),var(--g-pa))}
.glass.dk{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.02) 55%),rgba(16,16,22,var(--g-dka));color:#fff;
  --g-hl:rgba(255,255,255,.42);--g-stroke:rgba(255,255,255,.22);--g-edge:rgba(0,0,0,.16);--g-shadow:0 6px 20px rgba(0,0,0,.25);--press-c:rgba(0,0,0,.18);--press-l:rgba(255,255,255,.16)}
/* кромка: статичный блик по краю, как у эталона (свет сверху-слева) */
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
  background:conic-gradient(from var(--ga,210deg),rgba(255,255,255,.9),rgba(255,255,255,.08) 18%,rgba(255,255,255,0) 32%,rgba(255,255,255,.45) 50%,rgba(255,255,255,.05) 66%,rgba(255,255,255,0) 82%,rgba(255,255,255,.9));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75}
/* преломление (Chromium: Android/десктоп) — подставляется скриптом */
.glass.refract{-webkit-backdrop-filter:var(--rf);backdrop-filter:var(--rf)}
/* фолбэк без backdrop-filter и «Уменьшить прозрачность» */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass,.glass.pn{background:var(--g-solid)}.glass.dk{background:rgba(22,22,28,.86)}}
:root[data-rt] .glass,:root[data-rt] .glass.pn,:root[data-rt] .glass.refract{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--g-solid)}
:root[data-rt] .glass.dk{background:rgba(22,22,28,.88)}
/* нажатие: лёгкий scale + затемнение, без свечения */
.tap,button.glass,.btn,.chip,.plan{transition:transform var(--tb) var(--bouncy),background-color .2s,color .2s,opacity .2s}
/* нажатие как у interactive glass в iOS 26: элемент упруго увеличивается и светлеет, без пятна света под пальцем */
.pr{transform:scale(var(--ps,1.1));--press:var(--press-l)}
.pr::before{opacity:1}
.btn,.lc,.mt,.plan,.pbanner,.hd .who,.reply,.search,.sfield{--ps:1.03}.chip{--ps:1.06}.ci,.crow,button.row,.opt{--ps:1}
.ci.pr,.crow.pr,button.row.pr,.opt.pr{background:var(--press-c)}

/* ============ ЭКРАНЫ ============ */
.view{position:absolute;inset:0;z-index:1;isolation:isolate;visibility:hidden;opacity:0;transform:scale(.985);transition:opacity .15s ease-in,transform .2s ease-in,border-radius .3s,visibility 0s .3s;overflow:hidden}
.view.on{visibility:visible;opacity:1;transform:none;transition:opacity .2s ease-out,transform var(--ts) var(--smooth),border-radius var(--ts) var(--smooth)}
.view::after{content:"";position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity var(--ts) var(--smooth)}
.view.on.under{transform:translateX(-30%)}.view.under::after{opacity:var(--dim,1)}
.view.pg{background:radial-gradient(70% 45% at 105% -5%,var(--blob1),transparent 70%),radial-gradient(60% 40% at -10% 35%,var(--blob2),transparent 70%),radial-gradient(70% 45% at 90% 105%,var(--blob3),transparent 70%),var(--bg)}

.view.swipe,.view.swipe::after{transition:none!important}
.scroller{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.pad{padding:calc(var(--top) + 16px) calc(16px + var(--sr)) calc(var(--bot) + 92px) calc(16px + var(--sl))}
h1{font-size:34px;line-height:1.05;margin:6px 4px 16px;font-weight:800;letter-spacing:-.02em}
h3{scroll-margin-top:calc(var(--top) + 60px);font-size:13px;color:var(--mute);font-weight:600;margin:22px 8px 8px}
.muted{color:var(--mute)}
/* шапка, появляется при прокрутке (стекло) */
.hbar,.ebot,.etop{position:absolute;left:0;right:0;z-index:6;pointer-events:none;-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%)}
.hbar{top:0;height:calc(var(--top) + 40px);display:flex;align-items:flex-start;justify-content:center;padding-top:calc(var(--stop) + 13px);font-weight:700;font-size:17px;
  background:linear-gradient(rgba(var(--bg-rgb),.88),rgba(var(--bg-rgb),.6) 65%,rgba(var(--bg-rgb),0));-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  -webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);opacity:0;transition:opacity .25s ease-out}
.hbar span{transform:translateY(6px);opacity:0;transition:transform var(--ts) var(--smooth),opacity .2s}
.scrolled .hbar{opacity:1}.scrolled .hbar span{transform:none;opacity:1}
.ebot{bottom:0;height:calc(var(--bot) + 86px);background:linear-gradient(rgba(var(--bg-rgb),0),rgba(var(--bg-rgb),.4));
  -webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}
.etop{top:0;height:calc(var(--top) + 76px);background:linear-gradient(rgba(var(--bg-rgb),.55),rgba(var(--bg-rgb),0));
  -webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent);z-index:2}
:root[data-rt] .hbar,:root[data-rt] .ebot,:root[data-rt] .etop{-webkit-backdrop-filter:none;backdrop-filter:none}

/* ============ ЛЕНТА ============ */
#feed{scroll-snap-type:y mandatory}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111;color:#fff;transition:transform var(--d) var(--ease),opacity .3s ease-in}
.card.out{transform:translateX(-35%) rotate(-4deg);opacity:0}.card.liked-out{transform:translateY(-6%) scale(.96);opacity:0}
.ph{position:absolute;inset:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .2s ease-out,transform .4s var(--out);pointer-events:none}.ph img.on{opacity:1;transform:none}
.bars{position:absolute;top:calc(var(--top) + 26px);left:50%;transform:translateX(-50%);display:flex;gap:4px;width:min(40%,180px);z-index:3}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(0,0,0,.42);box-shadow:0 0 0 .5px rgba(255,255,255,.12);transition:background .2s}.bars i.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.14),transparent 12%,transparent 62%,rgba(0,0,0,.22) 78%,rgba(0,0,0,.46));pointer-events:none}
.info{position:absolute;left:calc(18px + var(--sl));right:84px;bottom:calc(var(--bot) + 86px);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.35),0 2px 14px rgba(0,0,0,.45)}
.info h2{font-size:30px;line-height:1.08;margin:0 0 6px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;flex-wrap:wrap;column-gap:10px;text-wrap:balance}
.info .meta{font-size:14px;opacity:.9;margin:0 0 8px;display:flex;gap:6px;align-items:center}.info .meta span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.info .bio{font-size:15px;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(48,209,88,.25)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:13px;padding:5px 11px;border-radius:99px}
.acts{position:absolute;right:calc(12px + var(--sr));bottom:calc(var(--bot) + 90px);display:flex;flex-direction:column;gap:14px;z-index:4}
.act{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}
.act.sm{width:46px;height:46px;margin-inline:5px}.act svg.i{width:26px;height:26px}.act.sm svg.i{width:21px;height:21px}
.act.like.done{background:linear-gradient(180deg,#ff6b81,#ff2d55);box-shadow:0 8px 24px rgba(255,45,85,.45),inset 0 1px 0 rgba(255,255,255,.4)}.act.like.done svg{fill:#fff}

/* тумблер в духе эталона: белая «капля» становится стеклянной при нажатии */

  transition:transform var(--tb) var(--bouncy),background .2s,box-shadow .2s}

.savebar{position:sticky;bottom:calc(var(--bot) + 74px);display:flex;gap:8px;padding:6px;border-radius:99px;margin-top:16px;z-index:5}
.savebar .btn{flex:1;height:46px}

/* ============ ШТОРКИ, УВЕДОМЛЕНИЯ, ОВЕРЛЕИ ============ */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s ease-in;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto;transition:opacity .25s ease-out}
.sheet{position:absolute;left:calc(8px + var(--sl));right:calc(8px + var(--sr));bottom:calc(8px + var(--bot) * .5);z-index:41;border-radius:36px;max-height:calc(100% - var(--top) - 40px);display:flex;flex-direction:column;
  transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .25s ease-in,visibility 0s .25s}
.sheet.on{transform:none;visibility:visible;transition:transform var(--tn) var(--snappy)}
.sheet.morph{transition:none!important}
.sheet.drag{transition:none}.grab{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:8px auto 0;flex:none}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;touch-action:none}
.sheet .sh-h b{font-size:19px}.sheet .x{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center}.sheet .x svg.i{width:16px;height:16px;stroke-width:2.4}
.sheet .sh-b{overflow-y:auto;padding:4px 18px 18px;scrollbar-width:none;overscroll-behavior:contain}
.sheet .sec{margin:18px 0}
.sheet .foot{display:flex;gap:10px;padding:6px 18px 18px}
.sheet .foot .btn{flex:1;white-space:nowrap;padding:0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;text-align:left;font-weight:600;transition:background .15s}
.opt+.opt{border-top:.5px solid var(--line)}.opt.red{color:var(--acc-ink)}
#match{position:absolute;inset:0;z-index:50;display:grid;place-items:center;text-align:center;color:#fff;padding:30px;background:radial-gradient(circle at 50% 35%,rgba(255,45,85,.55),rgba(8,8,12,.94) 70%);opacity:0;pointer-events:none;transition:opacity .3s ease-out}
#match.on{opacity:1;pointer-events:auto}
#match .pair{position:relative;height:170px;width:260px;margin:0 auto 26px}
#match .pair img{position:absolute;top:10px;width:150px;height:150px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 20px 50px rgba(0,0,0,.5);transition:transform .6s var(--bounce)}
#match .pair img:first-child{left:0;transform:translateX(-60px) rotate(-12deg)}#match .pair img:last-of-type{right:0;transform:translateX(60px) rotate(12deg)}
#match.on .pair img:first-child{transform:rotate(-8deg)}#match.on .pair img:last-of-type{transform:rotate(8deg)}
#match .hh{position:absolute;left:50%;top:62px;width:56px;height:56px;margin-left:-28px;border-radius:50%;display:grid;place-items:center;z-index:2;background:var(--acc);box-shadow:0 8px 24px rgba(255,45,85,.5);transform:scale(0);transition:transform .5s .25s var(--bounce)}
#match.on .hh{transform:scale(1)}#match .hh svg{width:26px;height:26px;fill:#fff}
#match h2{font-size:40px;margin:0 0 8px;letter-spacing:-.02em}#match p{opacity:.9;margin:0 0 28px}
#match .btn{width:min(300px,100%);margin:6px auto;display:flex}
#toast{position:absolute;left:50%;top:calc(var(--top) + 14px);transform:translate(-50%,calc(-100% - var(--top) - 30px));visibility:hidden;z-index:60;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;
  transition:transform .3s var(--out),visibility 0s .3s;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible;transition:transform var(--tb) var(--bouncy)}
#notif{position:absolute;left:calc(10px + var(--sl));right:calc(10px + var(--sr));top:calc(var(--top) + 8px);z-index:61;display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-radius:22px;text-align:left;
  transform:translateY(calc(-100% - var(--top) - 30px));visibility:hidden;transition:transform .3s var(--out),visibility 0s .3s}
#notif.on{transform:none;visibility:visible;transition:transform var(--tb) var(--bouncy)}
#notif img{width:42px;height:42px;border-radius:50%;object-fit:cover}#notif .grow{flex:1;overflow:hidden}#notif b{display:block;font-size:15px}
#notif span{display:block;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--card-in);width:100%;text-align:left;margin-bottom:8px;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s}
.plan.on{box-shadow:inset 0 0 0 2px var(--acc)}.plan .grow{flex:1}.plan b{display:block}.plan small{color:var(--mute)}.plan .pr{font-weight:800;white-space:nowrap}
.perk{display:flex;gap:12px;align-items:center;padding:8px 0}.perk .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,45,85,.12);color:var(--acc-ink);flex:none}.perk .ic svg.i{width:20px;height:20px}
.pmhead{text-align:center;padding:8px 0 4px}.pmhead .ico-big{background:linear-gradient(160deg,#ff8a9d,#ff2d55);color:#fff;box-shadow:0 14px 30px rgba(255,45,85,.4)}
.pmhead h2{margin:14px 0 4px;font-size:26px}
#splash{position:absolute;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .3s ease-in,visibility 0s .3s}
#splash.off{opacity:0;visibility:hidden}#splash .lg{display:grid;justify-items:center;gap:14px;animation:spl .5s var(--out) both}
#splash .ico-big{width:84px;height:84px;border-radius:28px;background:linear-gradient(160deg,#ff8a9d,#ff2d55);color:#fff;box-shadow:0 18px 40px rgba(255,45,85,.4),inset 0 1px 1px rgba(255,255,255,.5)}
#splash .ico-big svg.i{width:40px;height:40px}#splash b{font-size:24px;letter-spacing:-.02em}
@keyframes spl{from{transform:scale(.85);opacity:0}}
</style>

<script>
{
const VERSION='1.3.0';
/* Ссылка на поддержку: укажите свой аккаунт или бота, например 'https://t.me/your_support'. Пусто — пункт покажет «не настроена». */
const SUPPORT_URL='';

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=(n,st='')=>`<svg class="i" ${st}><use href="#${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('om:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('om:'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('om:'+k)}catch(e){}}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* Нормализация для поиска: регистр не важен, «ё» = «е». Длина строки сохраняется — индексы совпадают с оригиналом. */
const NORM=s=>{let o='';for(let i=0;i<s.length;i++){let c=s[i].toLowerCase();if(c.length!==1)c=s[i];o+=c==='ё'?'е':c}return o};
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

/* ---------- Telegram ---------- */
const TG=(()=>{const W=window.Telegram?.WebApp;return W&&W.platform&&W.platform!=='unknown'?W:null})();
const tgv=x=>!!(TG&&TG.isVersionAtLeast&&TG.isVersionAtLeast(x));
const hex=c=>{const m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join(''):'#000000'};

/* ---------- Настройки ---------- */
const DEF_S={theme:'system',font:'m',glass:'mid',rt:false,haptic:true,motion:false,enter:true,nSound:true,nVibe:true,nPreview:true,city:1};
let S={...DEF_S,...store.get('settings',{})};
const RM=()=>S.motion||matchMedia('(prefers-reduced-motion: reduce)').matches;
function saveSettings(){store.set('settings',S);
  if(TG&&tgv('6.9')&&TG.CloudStorage){try{TG.CloudStorage.setItem('settings',JSON.stringify(S),()=>{})}catch(e){}}}
let thT;
function applySettings(animTheme){const d=document.documentElement;
  if(animTheme&&!RM()){d.classList.add('theming');clearTimeout(thT);thT=setTimeout(()=>d.classList.remove('theming'),260)}
  if(S.theme==='system'){TG&&TG.colorScheme?d.setAttribute('data-theme',TG.colorScheme):d.removeAttribute('data-theme')}else d.setAttribute('data-theme',S.theme);
  d.setAttribute('data-glass',S.glass);d.setAttribute('data-fs',S.font);
  d.toggleAttribute('data-rt',!!S.rt);S.motion?d.setAttribute('data-motion','reduce'):d.removeAttribute('data-motion');
  requestAnimationFrame(()=>{paintTG();lenses()})}
function paintTG(){if(!TG)return;const bg=hex(getComputedStyle(document.body).backgroundColor);
  try{if(tgv('6.1')){TG.setHeaderColor(bg);TG.setBackgroundColor(bg)}if(tgv('7.10'))TG.setBottomBarColor(bg)}catch(e){}}
function haptic(k='light'){if(!S.haptic)return;try{TG?.HapticFeedback?.impactOccurred(k)}catch(e){}}
function hapticSel(){if(!S.haptic)return;try{TG?.HapticFeedback?.selectionChanged()}catch(e){}}

/* ---------- Города (только Россия, из cities.js) ---------- */
const CITIES=(window.RU_CITIES||[]).map(([id,name,nick,reg,clar,pop])=>({id,name,nick,reg,clar,pop,k:NORM(name),kn:NORM(nick)}));
const CMAP=new Map(CITIES.map(c=>[c.id,c]));
const cityName=id=>{const c=CMAP.get(+id);return c?(c.clar||c.name):'Город не выбран'};
if(!CMAP.has(+S.city))S.city=CMAP.has(1)?1:(CITIES[0]?.id||1);

/* ---------- Фото-иллюстрации для демо-анкет ---------- */
let artCache={};
function art(seed,g,h,v){
  const key=seed+g+h+v;if(artCache[key])return artCache[key];
  const r=rng(seed*7+v*131);const h2=(h+30+r()*70)%360,sk=18+r()*16,sl=50+r()*24,hl=8+r()*24;
  const sc=[1,.74,.5][v],cx=v?200+r()*200:300,lx=v===1?(cx>300?140:460):430;
  let bok='';for(let i=0;i<9;i++)bok+=`<circle cx="${r()*600|0}" cy="${r()*560|0}" r="${10+r()*50|0}" fill="#fff" opacity="${(.06+r()*.2).toFixed(2)}"/>`;

const SR={q:'',n:0,i:-1};let hitK=0;
function hl(t){if(!SR.q)return esc(t);const n=NORM(t),L=SR.q.length;let out='',p=0,ix;
  while((ix=n.indexOf(SR.q,p))!==-1){out+=esc(t.slice(p,ix))+`<mark class="hl${hitK===SR.i?' cur':''}" data-k="${hitK}">${esc(t.slice(ix,ix+L))}</mark>`;hitK++;p=ix+L}
  return out+esc(t.slice(p))}
function renderMsgs(jump){const p=byId(cur),c=D.chats[cur],box=$('#msgs');let html='',lastDay='';hitK=0;
  if(!c.msgs.length)html=`<div class="cempty"><img src="${p.ph[0]}" alt=""><h2 style="margin:0 0 6px;font-size:22px">У вас пара: ${esc(p.name)}</h2><p class="muted" style="margin:0">${new Date(D.matches[cur]).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}. Начните с чего-нибудь из ${fem(p)?'её':'его'} профиля:</p>
<div class="chips">${[`Привет, ${p.name}! 👋`,`${p.tags[0]} — это давно?`,'Как проходит день?'].map(s=>`<button class="chip" data-ice="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
  c.msgs.forEach(m=>{const d=dayLbl(m.at);if(d!==lastDay){html+=`<div class="day glass pn">${d}</div>`;lastDay=d}
    html+=`<div class="m ${m.me?'out':'in'}${Date.now()-m.id<1500?' new':''}" data-mid="${m.id}"><span class="ri">${ic('reply')}</span>${m.reply?`<div class="q"><b>${m.reply.me?'Вы':esc(p.name)}</b>${esc(m.reply.t)}</div>`:''}${hl(m.t)}<span class="tm">${hm(m.at)}${m.me?(m.read?' ✓✓':' ✓'):''}</span></div>`});
  if(typing===cur)html+='<div class="typing"><i></i><i></i><i></i></div>';
  const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML=html;
  if(SR.q){SR.n=hitK;if(SR.i>=SR.n)SR.i=SR.n-1;updCount()}
  else if(jump||nearBottom)box.scrollTop=box.scrollHeight}
function updCount(){const t=$('#sCount');
  t.textContent=!SR.q?'Введите слово для поиска':SR.n?`${SR.i+1} из ${SR.n}`:'Ничего не найдено';
  $('#sUp').disabled=!SR.n||SR.i<=0;$('#sDn').disabled=!SR.n||SR.i>=SR.n-1}
function goHit(i){if(!SR.n)return;SR.i=Math.max(0,Math.min(SR.n-1,i));
  $$('#msgs mark.cur').forEach(m=>m.classList.remove('cur'));const el=$(`#msgs mark[data-k="${SR.i}"]`);updCount();if(!el)return;el.classList.add('cur');
  const b=$('#msgs'),r=el.getBoundingClientRect(),br=b.getBoundingClientRect();
  b.scrollBy({top:r.top-br.top-br.height/2+r.height/2,behavior:RM()?'auto':'smooth'})}
const runSearch=debounce(()=>{SR.q=NORM($('#csIn').value.trim());SR.i=-1;hitK=0;
  if(!SR.q){SR.n=0;renderMsgs(false);updCount();return}
  // первое совпадение — самое новое (как в Telegram), стрелка ↑ идёт к более старым
  let n=0;D.chats[cur].msgs.forEach(m=>{const s=NORM(m.t);let p=0,ix;while((ix=s.indexOf(SR.q,p))!==-1){n++;p=ix+SR.q.length}});
  SR.n=n;SR.i=n-1;renderMsgs(false);goHit(SR.i)},150);
function openSearch(){$('#v-chat').classList.add('searching');$('#csIn').value='';SR.q='';SR.n=0;SR.i=-1;updCount();setTimeout(()=>{$('#csIn').focus();lens($('.sfield'),'lgSf',7)},30);tgBack()}

  const n=performance.now(),d=Math.max(0,dx);es.v=(d-es.dx)/Math.max(1,n-es.t);es.t=n;es.dx=d;

  g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.12,t+i*.09+.01);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.25);o.connect(g);g.connect(ac.destination);o.start(t+i*.09);o.stop(t+i*.09+.3)})}catch(e){}}

function markDirty(re){dirty=true;guardClose();if(re||!$('.savebar'))renderProfile()}
function saveProfile(){const m=draft;errs={};

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k|0;c.height=im.height*k|0;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=u})}

  const big=list.filter(c=>c.pop>=1e6).sort((a,b)=>b.pop-a.pop);
  const rest=list.filter(c=>c.pop<1e6).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  if(!list.length){box.innerHTML=`<div class="cempty2"><div class="ico-big glass">${ic('pin')}</div><h2 style="font-size:22px;margin:14px 0 6px">Ничего не найдено</h2><p class="muted" style="margin:0">В списке только города России. Проверьте название или попробуйте сокращение — например, «Питер» или «ЕКБ».</p></div>`;return}

(function tilt(){
  let ga=210,pend=null;const setA=a=>{if(Math.abs(a-ga)<2)return;ga=a;if(pend)return;pend=requestAnimationFrame(()=>{pend=null;document.documentElement.style.setProperty('--ga',ga.toFixed(0)+'deg')})};
  const on=()=>!RM()&&!S.rt;
  if(TG&&tgv('8.0')&&TG.DeviceOrientation){
    const start=()=>{if(on())try{TG.DeviceOrientation.start({refresh_rate:50})}catch(e){}};
    TG.onEvent('deviceOrientationChanged',()=>{const g=TG.DeviceOrientation.gamma||0,b=TG.DeviceOrientation.beta||0;setA(210+Math.max(-60,Math.min(60,g*57.3))+Math.max(-20,Math.min(20,(b*57.3-45)*.3)))});
    start();TG.onEvent('activated',start);TG.onEvent('deactivated',()=>{try{TG.DeviceOrientation.stop()}catch(e){}})}
  else addEventListener('deviceorientation',e=>{if(on()&&e.gamma!=null)setA(210+Math.max(-60,Math.min(60,e.gamma)))},{passive:true});
})();

const canRefract=/Chrome\//.test(navigator.userAgent)&&!/iPhone|iPad|iPod/.test(navigator.userAgent)&&!matchMedia('(prefers-reduced-transparency: reduce)').matches
  &&CSS.supports('backdrop-filter','blur(1px)');
function lens(el,id,blur){if(!el)return;if(!canRefract||S.rt){el.classList.remove('refract');return}
  const w=Math.round(el.offsetWidth),h=Math.round(el.offsetHeight);if(!w||!h)return;
  const k={low:.5,mid:1,high:1.5}[S.glass]||1,rr=Math.min(h/2,w/2,28),e=Math.min(16,h/3),b=Math.round(blur*k*({low:.6,mid:1,high:1.4}[S.glass]||1));
  const map=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><defs><linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#f00"/></linearGradient><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#0f0"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="${e/2}"/></filter></defs><rect width="${w}" height="${h}" rx="${rr}" fill="url(#r)"/><rect width="${w}" height="${h}" rx="${rr}" fill="url(#g)" style="mix-blend-mode:screen"/><rect x="${e}" y="${e}" width="${w-2*e}" height="${h-2*e}" rx="${Math.max(0,rr-e)}" fill="#808080" filter="url(#b)"/></svg>`;
  let f=document.getElementById(id);if(!f){f=document.createElementNS('http://www.w3.org/2000/svg','filter');f.id=id;$('#lgdefs').appendChild(f)}
  f.setAttribute('x',0);f.setAttribute('y',0);f.setAttribute('width',w);f.setAttribute('height',h);f.setAttribute('filterUnits','userSpaceOnUse');f.setAttribute('color-interpolation-filters','sRGB');
  f.innerHTML=`<feGaussianBlur in="SourceGraphic" stdDeviation="${b}" result="bl"/><feImage href="data:image/svg+xml;charset=utf-8,${encodeURIComponent(map)}" x="0" y="0" width="${w}" height="${h}" result="m"/><feDisplacementMap in="bl" in2="m" scale="${-Math.round(h*.5*k)}" xChannelSelector="R" yChannelSelector="G" result="d"/><feColorMatrix in="d" type="saturate" values="1.8"/>`;
  el.style.setProperty('--rf',`url(#${id}) brightness(1.04)`);el.classList.add('refract')}
function lenses(){lens(nbg,'lgNav',8);$$('.topbar .glass').forEach((b,i)=>lens(b,'lgTop'+i,5));if(overlay==='chat')lens($('.inp'),'lgInp',7)}

/* ---------- Клавиатура: композер над клавиатурой, бар скрыт ---------- */
const vv=window.visualViewport;
if(vv){const fit=()=>{const app=$('#app');if(document.body.classList.contains('kb')&&innerWidth<700){app.style.height=vv.height+'px';window.scrollTo(0,0);if(overlay==='chat'&&!SR.q){const b=$('#msgs');b.scrollTop=b.scrollHeight}}else app.style.height=''};
  vv.addEventListener('resize',fit);document.addEventListener('focusout',()=>setTimeout(fit,80))}
addEventListener('resize',debounce(()=>{moveInd(false);lenses();segFix(false)},120));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(backAction())e.preventDefault();return}
  if(view==='discover'&&!overlay&&!document.body.classList.contains('kb')&&!sheet.classList.contains('on')){const cards=$$('.card[data-id]',feed),i=Math.round(feed.scrollTop/feed.clientHeight),c=cards[i];
    if(e.key==='ArrowDown'){e.preventDefault();feed.scrollBy({top:feed.clientHeight,behavior:RM()?'auto':'smooth'})}if(e.key==='ArrowUp'){e.preventDefault();feed.scrollBy({top:-feed.clientHeight,behavior:RM()?'auto':'smooth'})}
    if(c&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const ph=$('.ph',c);showPhoto(ph,+ph.dataset.i+(e.key==='ArrowRight'?1:-1))}}});

renderFeed();badges();syncSend();requestAnimationFrame(()=>{moveInd(false);lenses();segFix(false)});
}
